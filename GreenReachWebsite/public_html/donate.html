  <meta name="keywords" content="urban gardening, Johannesburg, food security, sustainability, volunteering, non-profit, GreenReach">
  <meta name="author" content="GreenReach Community Garden Team">

  <!-- Open Graph for Social Media -->
  <meta property="og:title" content="GreenReach Community Garden">
  <meta property="og:description" content="Join GreenReach in building a greener, healthier Johannesburg through urban gardening and sustainability education.">
  <meta property="og:image" content="images/garden1.png">
  <meta property="og:type" content="website">

<body>
    <!-- HEADER -->
    <header>
        <h1>GreenReach Community Garden</h1>
        <nav>
            <ul>
                 <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="volunteer.html">Volunteer</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>
            <section class="form-section">
              <h2>Support GreenReach</h2>
              <p>Your donation helps us buy seeds, tools, and training materials for community gardens.</p>

              <form id="donateForm">
                <label for="dname">Full Name:</label>
                <input type="text" id="dname" name="dname" placeholder="Your full name" required>

                <label for="demail">Email Address:</label>
                <input type="email" id="demail" name="demail" placeholder="you@example.com" required>

                <label for="damount">Donation Amount (R):</label>
                <input type="number" id="damount" name="damount" min="10" step="10" placeholder="100" required>

                <label for="dpayment">Payment Method:</label>
                <select id="dpayment" name="dpayment" required>
                  <option value="">Select...</option>
                  <option value="eft">EFT / Bank Transfer</option>
                  <option value="card">Credit / Debit Card</option>
                  <option value="cash">Cash Donation</option>
                </select>

                <label for="dmessage">Message (optional):</label>
                <textarea id="dmessage" name="dmessage" rows="4" placeholder="A short message of support"></textarea>

                <button type="submit">Donate Now</button>
              </form>
            </section>
    </main>

    <!-- FOOTER -->
    <footer>
